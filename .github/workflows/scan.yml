name: scan

on:
  schedule:
    # Continuous coverage, weekday-only, chunked so each job stays well under
    # the 6-hour hosted-runner limit. Each job runs the agent's live 30s scan
    # loop continuously for its window, then commits the collected data.
    #
    #   PRE     08:00 UTC -> 13:20 UTC  (320 min)  US pre-market session
    #   MARKET1 13:30 UTC -> 17:00 UTC  (210 min)  US open -> mid
    #   MARKET2 17:00 UTC -> 20:00 UTC  (180 min)  US mid -> close
    #   POST    20:00 UTC -> 21:30 UTC  (90 min)   US post-market auction
    - cron: "0 8 * * 1-5"
    - cron: "30 13 * * 1-5"
    - cron: "0 17 * * 1-5"
    - cron: "0 20 * * 1-5"
    # Once after the close (21:40 UTC = 5:40pm ET), grade the day's alerts.
    - cron: "40 21 * * 1-5"
    # Refresh the market-regime history before the US session on trading days.
    - cron: "20 12 * * 1-5"
  workflow_dispatch:
    inputs:
      chunk:
        description: "Scan window to run now (pre | market1 | market2 | post | all)"
        required: false
        default: "all"

# Only one scan window runs at a time so windows never overlap and every
# continuous chunk commits cleanly without git push conflicts.
concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Continuous scan loops. One job per chunk so each can be gated on its own
  # cron trigger. All share the same run-and-persist flow.
  # ---------------------------------------------------------------------------
  pre:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: (github.event_name == 'schedule' && contains(github.event.schedule, '0 8 * * 1-5')) || (github.event_name == 'workflow_dispatch' && (inputs.chunk == 'all' || inputs.chunk == 'pre'))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Run live pre-market window (320 min)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: bash .github/scripts/run-window.sh 320

  market1:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: (github.event_name == 'schedule' && contains(github.event.schedule, '30 13 * * 1-5')) || (github.event_name == 'workflow_dispatch' && (inputs.chunk == 'all' || inputs.chunk == 'market1'))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Run live market open window (210 min)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: bash .github/scripts/run-window.sh 210

  market2:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: (github.event_name == 'schedule' && contains(github.event.schedule, '0 17 * * 1-5')) || (github.event_name == 'workflow_dispatch' && (inputs.chunk == 'all' || inputs.chunk == 'market2'))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Run live market close window (180 min)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: bash .github/scripts/run-window.sh 180

  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: (github.event_name == 'schedule' && contains(github.event.schedule, '0 20 * * 1-5')) || (github.event_name == 'workflow_dispatch' && (inputs.chunk == 'all' || inputs.chunk == 'post'))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Run live post-market window (90 min)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: bash .github/scripts/run-window.sh 90

  # ---------------------------------------------------------------------------
  # Daily regime seed and post-close labeling (kept from the previous config).
  # ---------------------------------------------------------------------------
  regime:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && contains(github.event.schedule, '20 12 * * 1-5'))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Seed regime history
        run: dotnet run --project 0dtes-agent.csproj -c Release -- --regime
      - name: Persist regime dataset
        run: bash .github/scripts/persist-regime.sh

  label:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && contains(github.event.schedule, '40 21 * * 1-5'))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Label completed alerts
        run: dotnet run --project 0dtes-agent.csproj -c Release -- --label
      - name: Persist labeled dataset
        run: bash .github/scripts/persist-labels.sh
