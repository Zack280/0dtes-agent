name: scan

on:
  schedule:
    # Scan every 5 minutes, Mon-Sun 13:30-21:20 UTC. Covers the full US market
    # session year-round (EST and EDT); weekends are skipped in the job.
    - cron: "*/5 13-21 * * *"
    # Once after the close (21:35 UTC = 4:35pm ET/5:35pm ET), grade the day's alerts.
    - cron: "35 21 * * 1-5"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Skip weekends
        run: |
          dow=$(date -u +%u)
          if [ "$dow" -gt 5 ]; then
            echo "Weekend ($(date -u +%A)), skipping scan."
            exit 0
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Scan once
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: dotnet run --project 0dtes-agent.csproj -c Release -- --scan-once

      - name: Persist alert dataset
        run: |
          if [ -f data/alerts.jsonl ]; then
            git add data/alerts.jsonl
            if ! git diff --cached --quiet; then
              git config user.name "0dtes-agent[bot]"
              git config user.email "0dtes-agent[bot]@users.noreply.github.com"
              git commit -m "dataset: record $(wc -l < data/alerts.jsonl) alert(s)"
              git push
            else
              echo "no alert changes to commit"
            fi
          else
            echo "no alerts produced this run (market closed or no signals)"
          fi

  label:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Runs on the weekday only (the labelled cron fires Mon-Fri), or on a manual dispatch.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && endsWith(github.event.schedule, '* 1-5'))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Label completed alerts
        run: dotnet run --project 0dtes-agent.csproj -c Release -- --label

      - name: Persist labeled dataset
        run: |
            if [ -f data/labels.jsonl ]; then
              git add data/labels.jsonl
              if ! git diff --cached --quiet; then
                git config user.name "0dtes-agent[bot]"
                git config user.email "0dtes-agent[bot]@users.noreply.github.com"
                git commit -m "dataset: label $(wc -l < data/labels.jsonl) alert(s)"
                git push
              else
                echo "no label changes to commit"
              fi
            else
              echo "no labels produced this run"
            fi